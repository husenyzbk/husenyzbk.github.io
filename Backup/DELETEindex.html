    <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- ================================================

    ================================================ -->

        <button class="nav-btn home-btn" onclick="goHome()">&#8962; HOME</button>

    <!-- ================================================
         FULLSCREEN IMAGE VIEWER
    ================================================ -->
    <div id="fullscreen-viewer">
        <button class="viewer-close" onclick="closeFullscreen()">&#8592; BACK</button>
        <button class="viewer-nav viewer-prev" onclick="prevImage()">&#10094;</button>
        <button class="viewer-nav viewer-next" onclick="nextImage()">&#10095;</button>
        <div class="viewer-wrapper">
            <img id="viewer-img" src="" alt="Full screen view">
        </div>
        <div class="viewer-counter">
            <span id="viewer-counter-text">1 / 1</span>
        </div>
        <div class="zoom-controls">
            <button class="zoom-btn" onclick="zoomOut()" title="Zoom Out">&#8722;</button>
            <span id="zoom-level">100%</span>
            <button class="zoom-btn" onclick="zoomIn()" title="Zoom In">&#43;</button>
        </div>
    </div>

    <!-- ================================================
         HOME PAGE
    ================================================ -->
    <div id="home-page" class="page active">

        <!-- HERO -->
        <section class="hero">
            <img id="hero-bg" src="" alt="Hero photo" class="hero-bg">
            <div class="hero-overlay"></div>
            <div class="hero-content">
                <h1 class="hero-title fade-in">Photography<br>Portfolio</h1>
                <p id="author-name" class="hero-author fade-in">By Hussein Yazbeck</p>
            </div>
        </section>

        <!-- BIO -->
        <section class="bio-section">
            <div class="bio-left reveal">
                <span class="bio-label">BIO</span>
                <p id="bio-text" class="bio-text"></p>
            </div>
            <div class="bio-right reveal">
                <img id="bio-img" src="" alt="About Hussein Yazbeck">
            </div>
        </section>

        <!-- CATEGORIES -->
        <section id="categories-section" class="categories-section">
            <h2 class="section-label reveal">Portfolio</h2>
            <div id="categories-grid" class="categories-grid"></div>
        </section>

        <!-- CONTACT -->
        <section class="contact-section">
            <h2 class="section-label reveal">Contact Me</h2>
            <div class="contact-form reveal">
                <div class="form-group">
                    <label for="contact-name">Name</label>
                    <input type="text" id="contact-name" placeholder="Your name...">
                </div>
                <div class="form-group">
                    <label for="contact-message">Message</label>
                    <textarea id="contact-message" placeholder="Your message..."></textarea>
                </div>
                <p id="form-error" class="form-error" role="alert"></p>
                <button class="contact-btn" onclick="sendEmail()">Send Message</button>
            </div>
        </section>

        <!-- FOOTER -->
        <footer class="footer">
            <p>&copy; <span id="footer-year"></span> Hussein Yazbeck Photography. All rights reserved.</p>
        </footer>

    </div>

    <!-- ================================================
         ALBUM PAGE
    ================================================ -->
    <div id="album-page" class="page">
        <div id="album-bg-overlay" class="album-bg-overlay"></div>
        <div class="album-page-content">
            <h1 id="album-title" class="album-title"></h1>
            <div id="album-grid" class="album-grid"></div>
        </div>
    </div>

    <!-- ================================================
         SUBCATEGORIES PAGE
    ================================================ -->
    <div id="subcategories-page" class="page">
        <div id="subcategories-bg-overlay" class="album-bg-overlay"></div>
        <div class="album-page-content">
            <h1 id="subcategories-title" class="album-title"></h1>
            <div id="subcategories-grid" class="categories-grid subcategories-grid"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
